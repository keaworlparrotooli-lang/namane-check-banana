
name: Build Banana APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir android-project
          unzip -q namane-banana-android-build-with-logo-v3.zip -d android-project

      - name: Build APK
        run: gradle -p android-project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: namane-banana-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
